<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu | Sri Laxmi Home Foods</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
     <header class="site-header">
    <nav class="navbar">

        <a href="index.html" class="brand">
            <img
                src="images/logo.png"
                alt="Sri Laxmi Home Foods"
                class="brand-logo"
            >

            <span>Sri Laxmi Home Foods</span>
        </a>

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open navigation menu"
        >
            ☰
        </button>

        <ul class="nav-links" id="navLinks">
            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="menu.html" class="active">
                    Menu
                </a>
            </li>

            <li>
                <a href="gallery.html">Gallery</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

            <li>
                <a href="profile.html">Profile</a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                    (<span id="cartCount">0</span>)
                </a>
            </li>
        </ul>

    </nav>
</header>
   



    <main class="menu-page">

        <section class="menu-heading">

            <p>OUR MENU</p>

            <h1>Homemade Food Menu</h1>

            <span>
                Freshly prepared homemade foods delivered across Hyderabad.
            </span>

        </section>

        <section class="menu-filters">

            <input
                type="search"
                id="menuSearch"
                placeholder="Search food items..."
            >

            <select id="menuCategory">

                <option value="All">
                    All Categories
                </option>

                <option value="Breakfast">
                    Breakfast
                </option>

                <option value="Lunch">
                    Lunch
                </option>

                <option value="Dinner">
                    Dinner
                </option>

                <option value="Snacks">
                    Snacks
                </option>

                <option value="Sweets">
                    Sweets
                </option>

                <option value="Pickles">
                    Pickles
                </option>

                <option value="Drinks">
                    Drinks
                </option>

            </select>

        </section>

        <div id="menuMessage" class="menu-message">
            Loading food items...
        </div>

        <section
            id="menuContainer"
            class="menu-container"
        ></section>

    </main>

    <script src="js/menu.js"></script>
    <script src="js/navbar.js?v=5"></script>

</body>

</html>
