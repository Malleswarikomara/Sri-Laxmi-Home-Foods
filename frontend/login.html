<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sri Laxmi Home Foods</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="auth-container">

        <h1>Sri Laxmi Home Foods</h1>

        <h2>Customer Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <div
                style="
                    width: 100%;
                    margin: 5px 0 15px;
                    text-align: right;
                "
            >
                <a
                    href="forgot-password.html"
                    style="
                        color: #8b0000;
                        font-size: 14px;
                        font-weight: 600;
                        text-decoration: none;
                    "
                >
                    Forgot Password?
                </a>
            </div>

            <button type="submit">
                Login
            </button>

            <p
                id="loginMessage"
                style="
                    margin-top: 12px;
                    text-align: center;
                "
            ></p>

        </form>

        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>
        </p>

        <p>
            <a href="index.html">
                Back to Home
            </a>
        </p>

    </div>

    <script src="js/auth.js?v=3"></script>

</body>

</html>
