<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Password | Sri Laxmi Home Foods
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="auth-container">

        <h1>Sri Laxmi Home Foods</h1>

        <h2>Reset Password</h2>

        <p>
            Enter and confirm your new password.
        </p>

        <form id="resetPasswordForm">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button
                type="submit"
                id="resetPasswordButton"
            >
                Reset Password
            </button>

            <p
                id="resetPasswordMessage"
                style="
                    margin-top: 15px;
                    text-align: center;
                    line-height: 1.5;
                "
            ></p>

        </form>

        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </div>

    <script src="js/reset-password.js?v=1"></script>

</body>

</html>
