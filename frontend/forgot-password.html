<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Forgot Password | Sri Laxmi Home Foods
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="auth-container">

        <h1>Sri Laxmi Home Foods</h1>

        <h2>Forgot Password</h2>

        <p>
            Enter your registered email address.
            We will send you a password reset link.
        </p>

        <form id="forgotPasswordForm">

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter registered email"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                id="forgotPasswordButton"
            >
                Send Reset Link
            </button>

            <p
                id="forgotPasswordMessage"
                style="
                    margin-top: 15px;
                    text-align: center;
                    line-height: 1.5;
                "
            ></p>

        </form>

        <p>
            Remember your password?

            <a href="login.html">
                Back to Login
            </a>
        </p>

        <p>
            <a href="index.html">
                Back to Home
            </a>
        </p>

    </div>

    <script src="js/forgot-password.js?v=1"></script>

</body>

</html>
