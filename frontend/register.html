<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="auth-container">

<h1>Sri Laxmi Home Foods</h1>

<h2>Create Account</h2>

<form id="registerForm">

<input type="text"
id="name"
placeholder="Full Name"
required>

<input type="email"
id="email"
placeholder="Email"
required>

<input type="text"
id="phone"
placeholder="Phone Number"
required>

<input type="password"
id="password"
placeholder="Password"
required>

<input type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script src="js/auth.js? v=2"></script>

</body>

</html>
